<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    

    <script>
        console.log("============While loop example==============");
        //part1: init part2 :condition part:modification

        // while(condition){
        //     //block
        //     //modification
        // }

        let i = 1;//init

        while(i<=10){//condition
            console.log("i=",i);
            i++;//modification    
        }

        // for(init;cond;mod){
        //     //block
        // }
        console.log("============for loop example==============");
        for(i=1;i<=10;i++){
            console.log("i=",i);
            
        }

        // do{
        //     //block
        // }while(condition)

        console.log("============do-while loop example==============");
        i=21;
        do{
            console.log("i=",i);
            i++;     
        }while(i<=10)

    </script>
</body>
</html>
