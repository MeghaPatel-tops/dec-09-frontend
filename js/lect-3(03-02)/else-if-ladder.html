        function findQudrant(){
            let x1 = prompt("Enter x1");
            let x2 = prompt("Enter x2");

            if(x1 > 0 && x2 > 0){
                alert("first")
            }
            else if(x1<0 && x2>0){

            }
            else if(x1<0 && x2<0){

            }
            else if(x1 >0 & x2 <0){
                alert("forth");
            }
            else{
                alert("Center line");
            }

        }

        function findNumber(){

            alert(result)
