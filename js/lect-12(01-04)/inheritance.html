            }

            AccountInfo(){

                `
                console.log(str);
                
            }
        }

        class Saving extends Account{
              constructor(per,holder,email,accno,bal){
                 
                  super(holder,email,accno,bal);
                  this.per=per;
                 
              }

              Calc(){
                  let amount = this.bal + ((this.bal*this.per)/100);
