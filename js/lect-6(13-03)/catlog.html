<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            
           position: relative;
        }
         .silde{
            padding: 100px;
            display: flex;
            height: 260px;
           overflow: hidden;
           position: relative;
        }
        .row{
            width: 100%;
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(3,1fr);
             gap: 20px;
            margin: 0px auto;
           
        }
        
        .col{
            width: 100%;
            height: 250px;
            border: 2px solid red;
           
        }
         #left{
            position: absolute;
            top: 50%;
            left: 10px;
            z-index: 1;
        }
        #right{
            position: absolute;
            top: 50%;
            right: 10px;
             z-index: 1;
        }
    </style>
</head>
<body>
    <button onclick="alert(1)">click</button>
   <div class="container">
      <button id="left">Left</button> 
      <button id="right" >right</button>
      <div class="silde">
            <div class="row row-1" id="row-1">
       <div class="col" id="col-1">col-1</div>
       <div class="col" id="col-2">col-2</div>
       <div class="col" id="col-3">col-3</div>
    </div>

    <div class="row row-2" id="row-2">
         <div class="col" id="col-4">col-4</div>
       <div class="col" id="col-5"></div>
       <div class="col" id="col-6"></div>
    </div>
     <div class="row row-3" id="row-3">
         <div class="col" id="col-7">col-7</div>
       <div class="col" id="col-8"></div>
       <div class="col" id="col-9"></div>
    </div>
      </div>
   </div>

   <script>
        document.getElementById('row-2').style.display="none"
        document.getElementById('row-3').style.display="none"

         let counter =1;

         
         
        document.getElementById('right').addEventListener('click',()=>{

           console.log("here");
            //console.log("before counter",counter);
            
            let preImg = document.getElementById('row-'+counter);
            preImg.style.display="none";

            counter++;
             if(counter > 3){
                counter=1;
            }
             //console.log("after counter",counter);
            let nextImg = document.getElementById('row-'+counter);
           
            nextImg.style.display="grid";
             
            
        })
   </script>
</body>
</html>
