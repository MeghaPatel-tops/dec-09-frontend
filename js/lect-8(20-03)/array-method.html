<body>
    
    <script>
        let fruits = ['apple','banana','kiwi','orange'];
        console.log(fruits);

        console.log(fruits[0]);
        console.log(fruits.at(0));

        console.log(fruits[fruits.length-1]);
        console.log(fruits.at(-1));

        //add element at end
        fruits.push('graps');
        console.log(fruits);

        //remove last element from end
        fruits.pop();
         console.log(fruits);

         //add element at start
         fruits.unshift('watermallon');
          console.log(fruits);

          //remove fisrt element from start
          fruits.shift();
           console.log(fruits);
        
        
        for(i=0;i<=fruits.length-1;i++){
            document.write(fruits[i]);
            document.write("<br>")
        }

        for(key in fruits){
            document.write(fruits[key]);
            document.write("<br>")
        }
        

        let a= [ [1,2,3],[4,5,6]];
             
            for(i=0;i<2;i++){

                    str = `a[${i}][${j}]=${a[i][j]}`
                    console.log(str);
                    
                }
            }

            
        
        
    </script>
