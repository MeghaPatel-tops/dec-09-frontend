    <script>
        //5! =  5*4! 5*4*3! 5*4*3*2! 5*4*3*2*1

        function factFind(num){//5
            if(num==1){
                return 1
            }
            f = num* factFind(num-1)
            return f;
        }

        console.log(factFind(5));
        
    </script>
