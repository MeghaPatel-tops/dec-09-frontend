         //========================function with parameter===================

         function addition(a,b){
              console.log(`addition = ${a+b}`);   
         }

         addition(100,200);
         addition(12.3,45.7);

         //===================function with default value===============
         function multiplication(x,y,z=1){
               let mul = x*y*z;
               console.log(`mul = ${mul}`);
               
         }

         multiplication(2,3,4);
         multiplication(2,6)



         //=========================Function returing value===================
         function simpleIntrest(p,n,r){
               let i = (p*r*n)/100;
               return i;
         }
        let ans =simpleIntrest(1000,2,3);
        console.log(`i=${ans}`);

        function FindSquare(num){
            return num*num;
        }

        console.log(FindSquare(12));
