<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Simple Calc</legend>
        <label for="">Enter num1</label>
        <input type="text" name="" id="num1">
        <label for="">Enter num2</label>
        <input type="text" name="" id="num2">
        <input type="button" value="+" onclick="cal('+')">
        <input type="button" value="-" onclick="cal('-')">
        <input type="button" value="*" onclick="cal('*')">
        <input type="button" value="/" onclick="cal('/')">
        <p id="result"></p>
    </fieldset>

    <script>

        function cal(op){
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;
            num1 = Number(num1);
            num2= Number(num2);
            let str;
            switch(op){
                case '+':
                    str=`Addition= ${num1+num2}`;
                break;
                case '-':   
                     str=`sub= ${num1-num2}`;
                break;
                case '*':
                     str=`mul= ${num1*num2}`;   
                break;
                case '/':
                     str=`div= ${num1/num2}`;   
                break;          
            }   
            document.getElementById('result').innerHTML=str;
            console.log(str);
            
        }
    </script>
</body>
</html>
