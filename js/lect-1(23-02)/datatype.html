<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //datatype:indicate type of data that varible can store

        //Number
        let num1=123;//let num1=3.14
        console.log("num=",num1);
        console.log(typeof(num1));

        //Big Int
        let bigNum = 900719925474099888n;
        console.log(bigNum);
        console.log(typeof(bigNum));

        //String
        let name='Megha patel';
        console.log(name);
        console.log(typeof(name));

        let data = `User name = ${name} loggin`;
        let numstr="123";
        console.log(numstr);
         console.log("typeof numstr=",typeof(numstr));
        

        console.log(data);
        

        //Boolen
        let isStudent = true;
        console.log(isStudent);
        console.log(typeof(isStudent));

        //Null
        let userInfo = null;
        console.log(userInfo);
        console.log(typeof(userInfo));

        //Undefine
        let x ;
        console.log(x);
        console.log(typeof(x))

        //Object
        let productInfo={
            productName:"laptop",
            price:210000
        }

        console.log(productInfo);
        console.log(typeof(productInfo));
        
        
        
        
        
        
        
        
        
        
        
        
    </script>
