<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .about-div{
            height: 350px;
            width: 40%;
            border:10px solid black;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .about-div img{
            height: 300px;
            width: 50%;
        }
        #img2{
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="about-div">
        <img src="about-1.jpg" alt="">
        <img src="about.jpg" alt="" id="img2">
    </div>
</body>
</html>
