<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 400px;
            width: 100%;
            margin: 50px 0px;
            border: 1px solid black;
        }
        #box-1{
            background: linear-gradient(to bottom left,red,rgb(167, 128, 128));
        }
        #box-2{
            background: radial-gradient(red 30%,rgb(167, 128, 128) ,white,yellow);
        }
        #box-3{
            background:conic-gradient(red, yellow, green);
        }
    </style>
</head>
<body>
    <div class="box" id="box-1"></div>
    <div class="box" id="box-2"></div>
    <div class="box" id="box-3"></div>
</body>
</html>
