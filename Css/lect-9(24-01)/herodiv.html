<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        .main{
            height: 500px;
            width: 100%;
            background-image: url(back.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-text{
            text-align: center;
        }
        .hero-text h1{
            font-size: 3em;
            font-weight: bolder;
            color: white;
            text-shadow: 2px 2px 3px red;
        }
        .hero-text p{
            color: white;
        }
        .hero-text button{
            padding: 10px 20px;
            border:none;
            background-color: brown;
            color: white;
            box-shadow: 3px 3px 4px white;
        }
        .service{
            display: flex;
            padding: 100px 100px;
            border: 10px solid black;
            gap: 50px;
        }
        .col{
            width: 100%;
            height: 200px;
            background-color: white;
            text-align: center;
            border-radius: 20px;
            box-shadow: 5px 5px  3px gray ;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="hero-text">
            <h1>COFFEE SHOP</h1>
            <p>BEST COFFEE SHOP IN SURAT</p>
            <button>Contact Us</button>
        </div>
    </div>

    <div class="service">
         <div class="col">COL-1</div>
         <div class="col">COL-2</div>
         <div class="col">COL-3</div>
    </div>
</body>
</html>
