<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box-1{
            border: 10px solid black;
            padding: 10px 100px;
            position: relative;
            top: 50px;
        }
         .box-2{
            border: 10px solid black;
            height: 200px;
            position: relative;
            top: 100px;
        }
        .inner{
            height: 100px;
            width: 100px;
            background-color: aqua;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }
        .fixed-div{
            height: 200px;
            width: 200px;
            background-color: gray;
            position: fixed;
            right: 0px;
            top: 200px;
        }
        .header{
            background-color: black;
            color:white;
            padding: 20px 100px;
            text-align: center;
            position: sticky;
            top: 0px;
            z-index: 1;
        }
    </style>
</head>
<body>
   
    <div class="box-1">
        box-1
        
    </div>
     <div class="header">
        <h1>Welcome to tops tech</h1>
    </div>
     <div class="box-2">
            <div class="inner">
                position:absolute
            </div>
     </div>
     <div class="fixed-div">
           fixeddiv example
     </div>

                position:absolute
            </div>
     </div>

     </div>

</body>
</html>
