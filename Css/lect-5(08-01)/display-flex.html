<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 400px;
            padding: 20px;
            border: 5px solid black;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1" style="order:4;flex-grow:4;background-color: red;">box-1</div>
        <div class="box" id="box-2" style="order:2">box-2</div>
        <div class="box" id="box-3" style="order:3">box-3</div>
        <div class="box" id="box-4" style="order: 1;flex-shrink: 2;">box-4</div>
        <div class="box" id="box-5" style="order:5">box-5</div>
        
    </div>
</body>
</html>
