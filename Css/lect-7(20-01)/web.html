<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .main{
            border: 5px solid aqua;
            display: grid;
            grid-template-areas: 'header header header header header' 
                                 'aside center center center center'
                                 'footer footer footer footer footer';
        }
        .header{
            grid-area: header;
            text-align: center;
            padding: 10px 20px;
             border: 5px solid aqua;
        }
        .aside{
            grid-area: aside;
            height: 400px;
             border: 5px solid aqua;
        }
        .center{
            grid-area: center;
             border: 5px solid aqua;
        }
        .footer{
            grid-area: footer;
             border: 5px solid aqua;
             text-align: center;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="header">
            <h1>Header</h1>
        </div>
        <div class="aside">
            <h2>Aside</h2>
        </div>
        <div class="center">
            <h2>Center</h2>
        </div>
        <div class="footer">
            <h2>Footer</h2>
        </div>
    </div>
</body>
</html>
