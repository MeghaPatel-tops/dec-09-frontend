<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 400px;
            width: 600px;
            background-color: aqua;
            display: grid;
            grid-template-columns: repeat(5,1fr);
            padding: 20px;
            gap: 50px;
        }
       
        #box-3{
            background-color: yellow;
        }
        #box-1{
            background-color: orange;
            padding: 20px;
            grid-column-start: 1;
            grid-column-end: 3;

        }
         #box-2{
            background-color: red;
            padding: 20px;
            grid-column-start: 3;
            grid-column-end: 5;
            
        }
        #box-4{
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end:4;
            background-color: blue;
        }
         #box-8{
            grid-column-start: 5;
            grid-column-end: 6;
            grid-row-start: 2;
            grid-row-end:4;
            background-color: blue;
        }
        #box-5{
             grid-column-start: 2;
            grid-column-end: 4;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            
        }
        .box-in{
            background-color: pink;
            align-self: start;
        }
        #box-6{
            background-color: blue;
             grid-column-start: 4;
            grid-column-end: 5;
            height: 150px;
        }

       
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">1</div>
        <div class="box" id="box-2">2</div>
        <div class="box" id="box-3">3</div>
        <div class="box" id="box-4">4</div>
        <div class="box" id="box-5">
            <div class="box-in">in-1</div>
            <div class="box-in">in-2</div>
            <div class="box-in">in-3</div>
        </div>
        <div class="box" id="box-6">6</div>
        <div class="box" id="box-7">7</div>
        <div class="box" id="box-8">8</div>
        <div class="box" id="box-9">9</div>
        <div class="box" id="box-10">10</div>
    </div>
</body>
</html>
