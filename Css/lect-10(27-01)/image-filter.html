<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img1{
            filter: grayscale(80%);
        }
        #img2{
            filter: blur(5px);
        }
        #img3{
            filter: brightness(60%);
        }
        #img4{
            filter: contrast(80%);
        }
        #img5{
            filter: drop-shadow(10px 10px 4px gray);
        }
        #img6{
            filter: opacity(0.6);
        }
    </style>
</head>
<body>
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img1">
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img2">
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img3">
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img4">
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img5">
    <img src="../lect-9(24-01)/back.jpg" alt="" id="img6">

</body>
</html>
