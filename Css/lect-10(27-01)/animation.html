<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            background-color: red;
            margin: 100px;
            animation-name: backChanger;
            animation-delay: 2s;
            animation-duration: 3s;
            animation-iteration-count: 3;
           
        }
        @keyframes backChanger {
             from{
                background-color: aqua;
             }
             to{
                background-color: blue;
             }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
